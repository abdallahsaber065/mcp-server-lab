version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cornerstone_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: cornerstone
      POSTGRES_PASSWORD: cornerstone_secret_pass
      POSTGRES_DB: cornerstone_realty
    ports:
      - "5434:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cornerstone -d cornerstone_realty"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cornerstone_redis_local
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass cornerstone_redis_pass
    ports:
      - "6380:6379"
    volumes:
      - redisdata_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cornerstone_redis_pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cornerstone_api_local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://cornerstone:cornerstone_secret_pass@postgres:5432/cornerstone_realty
      - REDIS_URL=redis://:cornerstone_redis_pass@redis:6379/0
      - JWT_SECRET_KEY=cornerstone_dev_secret_key_change_in_production_991283
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata_local:
  redisdata_local:
