[project]
name = "mcp-server-lab"
version = "0.1.0"
description = "Cornerstone Realty Group Model Context Protocol (MCP) Server Lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "litellm>=1.30.0",
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
