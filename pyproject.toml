[project]
name = "mcp-server-lab"
version = "0.1.0"
description = "Cornerstone Realty Group Model Context Protocol (MCP) Server Lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "litellm>=1.30.0",
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "langchain-core>=1.5.5",
    "networkx>=3.6.1",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "pgvector>=0.5.0",
    "ruff>=0.16.4",
    "basedpyright>=1.39.10",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "platform",
    "web/dist",
    "web/static",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "F401", "F841"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["mcp_server", "web", "db", "services", "rag", "memory", "planning"]
exclude = [".venv", "platform", "web/dist", "web/static"]




