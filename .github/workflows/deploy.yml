name: Build & Deploy MCP Server Lab

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image to GHCR with GHA Layer Caching
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Container via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/mcp-server-lab
            cat << 'EOF' > /opt/mcp-server-lab/docker-compose.yml
            services:
              mcp_server_lab:
                image: ghcr.io/abdallahsaber065/mcp-server-lab:latest
                container_name: mcp_server_lab
                restart: always
                env_file:
                  - .env
                ports:
                  - "127.0.0.1:8011:8000"
                networks:
                  - caddy_net

            networks:
              caddy_net:
                external: true
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f /opt/mcp-server-lab/docker-compose.yml pull
            docker compose -f /opt/mcp-server-lab/docker-compose.yml up -d --remove-orphans
            docker image prune -f
            sleep 3
            curl -sf http://127.0.0.1:8011/ > /dev/null && echo "✅ Container up at http://127.0.0.1:8011/" || echo "❌ Container health check failed"
