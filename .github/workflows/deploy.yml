name: Build & Deploy MCP Server Lab

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: 🐳 Build & Push Multi-Stage Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image to GHCR with GHA Layer Caching
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to Production VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Container via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "📁 Ensuring /opt/mcp-server-lab directory exists..."
            mkdir -p /opt/mcp-server-lab

            echo "📝 Writing production docker-compose.yml..."
            cat << 'EOF' > /opt/mcp-server-lab/docker-compose.yml
            services:
              mcp_server_lab:
                image: ghcr.io/abdallahsaber065/mcp-server-lab:latest
                container_name: mcp_server_lab
                restart: always
                env_file:
                  - .env
                ports:
                  - "127.0.0.1:8011:8000"
                networks:
                  - caddy_net
                  - core_db_net
                healthcheck:
                  test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/ || exit 1"]
                  interval: 15s
                  timeout: 5s
                  retries: 3
                  start_period: 10s

            networks:
              caddy_net:
                external: true
              core_db_net:
                external: true
            EOF

            echo "🔑 Logging in to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "📥 Pulling latest image..."
            docker compose -f /opt/mcp-server-lab/docker-compose.yml pull

            echo "🚀 Launching container..."
            docker compose -f /opt/mcp-server-lab/docker-compose.yml up -d --remove-orphans

            echo "🔄 Applying Alembic database migrations..."
            docker compose -f /opt/mcp-server-lab/docker-compose.yml exec -T mcp_server_lab uv run alembic upgrade head || true

            echo "🌱 Running database seeding..."
            docker compose -f /opt/mcp-server-lab/docker-compose.yml exec -T mcp_server_lab uv run python scripts/seed_db.py || true

            echo "🧹 Cleaning up old dangling Docker images..."
            docker image prune -f

            echo "⏳ Waiting for health check..."
            sleep 5
            curl -sf http://127.0.0.1:8011/api/health > /dev/null && echo "✅ Cornerstone Platform up & healthy at http://127.0.0.1:8011/" || echo "⚠️ Healthcheck warning (checking root fallback)..."
            curl -sf http://127.0.0.1:8011/ > /dev/null && echo "✅ SPA Index verified at http://127.0.0.1:8011/"
